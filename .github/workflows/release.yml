name: release

# A pushed tag v1.2.3 (or v1.2.3-rc.1) makes a release: esm for Linux and
# Windows (amd64), SHA256SUMS (first line "version <tag>", then the SHA-256
# of both binaries) and SHA256SUMS.sig, the Ed25519 signature of SHA256SUMS.
#
# Three jobs, so that the signing key meets as little code as possible:
#   build    no secrets, read-only token: checks the tag, runs vet and the
#            tests, builds the binaries and esm-sign, writes SHA256SUMS.
#   sign     the only job with the key. It runs in the environment "release"
#            (its secret ESM_RELEASE_KEY, the base64 of the 32-byte private
#            seed) and runs nothing but the esm-sign binary the build job
#            made, on the SHA256SUMS the build job wrote: no checkout, no Go
#            toolchain, no repository code. esm-sign refuses a key that does
#            not belong to the public key built into ESM and a SHA256SUMS
#            whose version is not the tag.
#   publish  no secrets, write token: publishes what the other two made.
# The environment "release" should allow deployments from v* tags only
# (README: "Releases and updates"). Without the secret the sign job fails
# and nothing is published.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}(-[0-9A-Za-z.]{1,64})?$'; then
            echo "::error::tag $TAG is not a version like v1.2.3"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: the release is built from a clean module and build
      # cache, never from one saved by another run.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: vet and test
        run: |
          go vet ./...
          go test ./...

      - name: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist signer
          for target in linux/amd64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=$TAG" -o "dist/esm-$os-$arch$ext" ./cmd/esm
          done
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o signer/esm-sign ./cmd/esm-sign
          (cd dist && { echo "version $TAG"; sha256sum esm-*; } > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signer
          path: signer/esm-sign
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signer
          path: signer

      - name: sign SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
          ESM_RELEASE_KEY: ${{ secrets.ESM_RELEASE_KEY }}
        run: |
          if [ -z "$ESM_RELEASE_KEY" ]; then
            echo "::error::the secret ESM_RELEASE_KEY of the environment release (the release signing key) is not set; nothing is published"
            exit 1
          fi
          chmod 0755 signer/esm-sign
          signer/esm-sign -version "$TAG" -in dist/SHA256SUMS -out SHA256SUMS.sig

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: SHA256SUMS.sig
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: dist

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag $pre \
            --notes "Binaries for Linux and Windows (amd64). SHA256SUMS lists their SHA-256 sums after a line naming the version; SHA256SUMS.sig is its Ed25519 signature by the key built into ESM. See the README for how to check them by hand."
